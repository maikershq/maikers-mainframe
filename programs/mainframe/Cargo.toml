[package]
name = "mainframe"
version = "1.0.0"
description = "keep calm and let the mainframe handle it."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mainframe"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
solana-security-txt = "1.1.1"
mpl-token-metadata = "5.0.1"
mpl-core = "0.9.1"

