name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust-checks:
    name: Rust Lint & Security
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

      - name: Install and run cargo-audit
        run: cargo audit

  anchor-build:
    name: Anchor Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: rust-checks
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Update source_revision with current commit
        run: ./scripts/update-source-revision.sh

      - name: Verify build tools
        run: |
          echo "=== Build Environment ==="
          rustc --version
          cargo --version
          solana --version
          anchor --version
          node --version
          yarn --version

      - name: Build Anchor program
        run: anchor build

      - name: Upload program artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-artifacts
          path: |
            target/deploy/
            target/idl/
          retention-days: 7

  typescript-checks:
    name: TypeScript Lint & Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: anchor-build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Anchor artifacts
        uses: actions/download-artifact@v4
        with:
          name: anchor-artifacts
          path: target/

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TypeScript code
        run: yarn run lint

      - name: Type check
        run: yarn run tsc --noEmit

