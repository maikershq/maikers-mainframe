name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'
  RUST_VERSION: '1.82'
  SOLANA_VERSION: '1.18.26'
  ANCHOR_VERSION: '0.31.1'

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            # Check if it's a prerelease (contains alpha, beta, rc)
            if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (prerelease: $IS_PRERELEASE)"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected: v1.0.0, v1.0.0-alpha.1, v1.0.0-beta.1, v1.0.0-rc.1"
            exit 1
          fi
          echo "✅ Valid version format: $VERSION"

  security-check:
    name: Pre-Release Security Check
    runs-on: ubuntu-latest
    needs: validate-release
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Run security audit
        run: |
          cargo install cargo-audit --version 0.21.1 --locked --force
          cargo audit --deny warnings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn and dependencies
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile

      - name: Check for critical vulnerabilities
        run: |
          AUDIT_RESULT=$(yarn audit --level critical --json | jq '.data.vulnerabilities | length' 2>/dev/null || echo "0")
          if [ "$AUDIT_RESULT" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found - blocking release"
            yarn audit --level critical
            exit 1
          fi
          echo "✅ No critical vulnerabilities found"

  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [validate-release, security-check]
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Solana installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana/
            ~/.local/share/solana/
          key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile

      - name: Update source_revision with current commit
        run: ./scripts/update-source-revision.sh

      - name: Build Anchor program
        run: anchor build --verifiable

      - name: Generate program checksum
        run: |
          cd target/deploy
          sha256sum mainframe.so > mainframe.so.sha256
          echo "Program checksum:" && cat mainframe.so.sha256

      - name: Verify IDL generation
        run: |
          if [ ! -f "target/idl/mainframe.json" ]; then
            echo "❌ IDL file not generated"
            exit 1
          fi
          echo "✅ IDL file generated successfully"

      - name: Create release archive
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          mkdir -p release-artifacts
          
          # Program binaries
          cp target/deploy/mainframe.so release-artifacts/
          cp target/deploy/mainframe.so.sha256 release-artifacts/
          
          # IDL files
          cp target/idl/mainframe.json release-artifacts/
          
          # Documentation
          cp README.md release-artifacts/
          cp LICENSE release-artifacts/
          
          # Create versioned archive
          tar -czf "mainframe-${VERSION}.tar.gz" -C release-artifacts .
          
          # Generate release info
          echo "# Mainframe ${VERSION}" > release-info.md
          echo "" >> release-info.md
          echo "**Program ID**: $(anchor keys list | grep mainframe | awk '{print $2}')" >> release-info.md
          echo "**Anchor Version**: ${{ env.ANCHOR_VERSION }}" >> release-info.md
          echo "**Solana Version**: ${{ env.SOLANA_VERSION }}" >> release-info.md
          echo "**Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release-info.md
          echo "" >> release-info.md
          echo "## Checksums" >> release-info.md
          echo "\`\`\`" >> release-info.md
          cat target/deploy/mainframe.so.sha256 >> release-info.md
          echo "\`\`\`" >> release-info.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ needs.validate-release.outputs.version }}
          path: |
            mainframe-*.tar.gz
            release-artifacts/
            release-info.md
          retention-days: 90

  multi-platform-verify:
    name: Multi-platform Verification
    runs-on: ${{ matrix.os }}
    needs: [validate-release, security-check]
    timeout-minutes: 30
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install platform dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install coreutils
          npm install -g yarn

      - name: Install platform dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm install -g yarn

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Update source_revision with current commit
        run: ./scripts/update-source-revision.sh

      - name: Verify build on ${{ matrix.os }}
        run: anchor build

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-release, multi-platform-verify]
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ needs.validate-release.outputs.version }}
          path: artifacts/

      - name: Generate changelog
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          
          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "$VERSION" | head -n1)
          
          echo "# Release Notes - $VERSION" > changelog.md
          echo "" >> changelog.md
          
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" >> changelog.md
            echo "" >> changelog.md
            
            # Get commits since last tag
            git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD" >> changelog.md
          else
            echo "## Initial Release" >> changelog.md
          fi
          
          echo "" >> changelog.md
          cat artifacts/release-info.md >> changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate-release.outputs.version }}
          name: Mainframe ${{ needs.validate-release.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ needs.validate-release.outputs.is_prerelease }}
          files: artifacts/mainframe-${{ needs.validate-release.outputs.version }}.tar.gz

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [validate-release, create-release]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: Notify success
        if: needs.create-release.result == 'success'
        run: |
          echo "🚀 Release ${{ needs.validate-release.outputs.version }} created successfully!"
          echo "📦 Release artifacts uploaded"
          echo "📝 Changelog generated"
          echo "🔗 Available at: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate-release.outputs.version }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Release ${{ needs.validate-release.outputs.version }} failed"
          echo "Check the workflow logs for details"
          exit 1
