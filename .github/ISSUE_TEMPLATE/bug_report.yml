name: 🐛 Bug Report
description: Report a bug in Mainframe protocol
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us reproduce and fix the issue.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected by this bug?
      options:
        - Anchor Program
        - TypeScript Client
        - Documentation
        - SDK Integration
        - Build System
        - Testing Infrastructure
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened and what you expected to happen...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run command '...'
        2. Execute transaction with '...'
        3. See error
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: What went wrong?
    validations:
      required: true

  - type: input
    id: anchor_version
    attributes:
      label: Anchor Version
      description: What version of Anchor are you using?
      placeholder: "0.31.1"
    validations:
      required: true

  - type: input
    id: solana_version
    attributes:
      label: Solana CLI Version
      description: What version of Solana CLI are you using?
      placeholder: "1.18.26"
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Which Solana network are you using?
      options:
        - Localnet
        - Devnet
        - Mainnet
        - Custom RPC
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Additional environment details
      placeholder: |
        - OS: [e.g. macOS 14.0, Ubuntu 22.04]
        - Node.js version: [e.g. 20.x]
        - Rust version: [e.g. 1.81]
        - Browser (if applicable): [e.g. Chrome 118]
      value: |
        - OS: 
        - Node.js version: 
        - Rust version: 
        - Browser (if applicable): 
    validations:
      required: false

  - type: textarea
    id: error_logs
    attributes:
      label: Error Logs/Output
      description: Please copy and paste any relevant error messages or logs.
      render: shell
      placeholder: Paste error logs here...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, related issues, etc.)
      placeholder: Any additional information that might help us understand the issue...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched for existing issues that might be related to this bug
          required: true
        - label: I have provided all the requested information above
          required: true
        - label: I have tested this on the latest version
          required: true
